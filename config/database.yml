default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: api_admin
  password: password
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: api_rails_pg_development

test:
  <<: *default
  database: api_rails_pg_test

production:
  <<: *default
  database: api_rails_pg_production
  password: <%= ENV["EXERCISE_DATABASE_PASSWORD"] %>